<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1b7a3d" />
    <title>Admin Reports</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="common.css" />
    <style>
      body { background: #f5f6f8; }
      .admin-layout { display: flex; min-height: 100vh; }
      .sidebar {
        width: 240px;
        background: var(--header-grad);
        color: white;
        padding: 24px 18px;
        position: fixed;
        top: 0; left: 0; bottom: 0;
        overflow-y: auto;
      }
      .sidebar-logo {
        width: 88px; height: 88px; object-fit: contain;
        background: #111; border-radius: 16px; padding: 6px;
        display: block; margin: 0 auto 14px;
      }
      .sidebar h5 { text-align: center; font-weight: 800; margin-bottom: 28px; }
      .nav-link-admin {
        display: flex; align-items: center; gap: 10px;
        color: white; text-decoration: none; padding: 12px 14px;
        border-radius: 10px; margin-bottom: 8px; font-weight: 600;
        border: 0; background: transparent; width: 100%; text-align: left;
      }
      .nav-link-admin:hover, .nav-link-admin.active {
        background: rgba(0, 0, 0, 0.28); color: #fff;
      }
      .admin-main { margin-left: 240px; padding: 28px; width: calc(100% - 240px); }
      .card-soft {
        background: white; border-radius: 20px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.06); padding: 22px;
      }
    </style>
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar">
        <img src="images/logo.png?v=warisan" class="sidebar-logo" alt="Logo" />
        <h5>WARISAN CAFE</h5>
        <a class="nav-link-admin" href="admin-dashboard1.html"
          ><i class="bi bi-speedometer2"></i> Orders</a
        >
        <a class="nav-link-admin" href="admin-batch1.html"
          ><i class="bi bi-calendar-plus"></i> Batch</a
        >
        <a class="nav-link-admin" href="admin-menu1.html"
          ><i class="bi bi-list-ul"></i> Menu</a
        >
        <a class="nav-link-admin" href="admin-riders1.html"
          ><i class="bi bi-bicycle"></i> Rider</a
        >
        <a class="nav-link-admin active" href="admin-reports1.html"
          ><i class="bi bi-file-earmark-excel"></i> Reports</a
        >
        <div class="sidebar-footer">
          <button class="nav-link-admin" type="button" onclick="AG.logout()">
            <i class="bi bi-box-arrow-left"></i> Logout
          </button>
        </div>
      </aside>
      <main class="admin-main">
        <div class="mb-4">
          <h2 class="fw-bold mb-1">Orders report</h2>
          <p class="text-muted mb-0">
            Download verified orders as Excel, with each order total and total sales.
            This does not load them on the live Orders page.
          </p>
        </div>
        <div class="card-soft">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label fw-semibold" for="fromDate">From</label>
              <input id="fromDate" type="date" class="form-control" />
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold" for="toDate">To</label>
              <input id="toDate" type="date" class="form-control" />
            </div>
            <div class="col-md-4">
              <button id="downloadBtn" class="btn btn-brand w-100 py-2" type="button">
                <i class="bi bi-download me-1"></i> Download Excel
              </button>
            </div>
          </div>
          <p class="small text-muted mt-3 mb-0" id="reportStatus">
            Verified payments only. Receipt photos are not included.
          </p>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
      (async () => {
        const s = await AG.requireRole(["admin"], ["batches"]);
        if (!s) return;
        const fromEl = document.getElementById("fromDate");
        const toEl = document.getElementById("toDate");
        const status = document.getElementById("reportStatus");
        const btn = document.getElementById("downloadBtn");
        const today = new Date();
        const from = new Date();
        from.setDate(today.getDate() - 30);
        const isoDay = (d) => d.toISOString().slice(0, 10);
        fromEl.value = isoDay(from);
        toEl.value = isoDay(today);

        function rangeIso() {
          const start = new Date(fromEl.value + "T00:00:00");
          const end = new Date(toEl.value + "T23:59:59.999");
          if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) {
            throw new Error("Please choose a valid date range.");
          }
          if (start > end) throw new Error("From date must be before To date.");
          return { from: start.toISOString(), to: end.toISOString() };
        }

        btn.addEventListener("click", async () => {
          try {
            btn.disabled = true;
            status.textContent = "Preparing report…";
            const { from, to } = rangeIso();
            const rows = await AG.fetchOrdersForReport(from, to);
            const file =
              "warisan-orders-" + fromEl.value + "-to-" + toEl.value + ".xlsx";
            const summary = AG.downloadOrdersExcel(rows, file);
            const sales = Number(summary?.sales || 0).toFixed(2);
            status.textContent =
              (summary?.count || 0) +
              " verified order(s). Total sales RM " +
              sales +
              ". They were not added to the live Orders page.";
          } catch (err) {
            status.textContent = err.message || "Download failed.";
            AG.toast("Report failed", err.message || "Download failed.");
          } finally {
            btn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
