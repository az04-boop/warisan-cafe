<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Warisan Cafe" />
    <link rel="apple-touch-icon" href="/images/logo.png?v=warisan" />
    <meta name="theme-color" content="#1b7a3d" />

    <title>Customer Login — Warisan Cafe</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="common.css" />
    <style>
      .input-group-modern {
        position: relative;
        margin-bottom: 14px;
      }
      .input-group-modern i.lead-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #aaa;
        font-size: 1.05rem;
        pointer-events: none;
      }
      .input-group-modern input {
        padding-left: 44px !important;
      }
      .divider-or {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 16px 0;
        color: #aaa;
        font-size: 0.82rem;
        font-weight: 600;
      }
      .divider-or:before,
      .divider-or:after {
        content: "";
        height: 1px;
        background: var(--border);
        flex: 1;
      }
      .btn-google {
        background: #fff;
        border: 1.5px solid var(--border);
        color: #444;
        padding: 12px;
        border-radius: var(--radius);
        font-weight: 600;
        transition: var(--transition);
        width: 100%;
      }
      .btn-google:hover {
        border-color: var(--brand);
        color: var(--brand);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body class="login-bg">
    <div class="login-card">
      <div class="login-header">
        <img src="images/logo.png?v=warisan" alt="Warisan Cafe" />
        <h5>Warisan Cafe</h5>
        <p>Customer login</p>
      </div>
      <div class="login-body">
      <h5 class="fw-bold text-center mb-1">Welcome Back!</h5>
      <p class="text-center text-muted small mb-4">
        Login to continue ordering
      </p>

      <form id="loginForm">
        <div class="input-group-modern">
          <i class="bi bi-envelope lead-icon"></i>
          <input
            id="email"
            type="email"
            class="form-control"
            placeholder="Email address"
            required
          />
        </div>
        <div class="input-group-modern">
          <i class="bi bi-lock lead-icon"></i>
          <input
            id="password"
            type="password"
            class="form-control"
            placeholder="Password"
            required
          />
        </div>
        <button class="btn btn-brand w-100 py-2" type="submit">
          <i class="bi bi-box-arrow-in-right me-1"></i> LOG IN
        </button>
      </form>

      <div class="divider-or">OR</div>

      <button class="btn-google" onclick="googleLogin()">
        <i class="bi bi-google me-2 text-danger"></i>Continue with Google
      </button>

      <p class="text-center small mb-1 mt-4">
        Don't have an account?
        <a href="register1.html" class="text-brand fw-bold text-decoration-none"
          >Create account</a
        >
      </p>
      <p class="text-center small text-muted mt-3 mb-0" style="font-size:0.72rem;line-height:1.4">
        We use your name, phone and delivery address only to process and deliver your order.
      </p>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          try {
            await AG.loginCustomer(
              document.getElementById("email").value,
              document.getElementById("password").value,
            );
            location.href = "cust-menu1.html";
          } catch (err) {
            AG.toast("Login failed", err.message);
          }
        });
      async function googleLogin() {
        try {
          await AG.googleLogin();
          location.href = "cust-menu1.html";
        } catch (err) {
          AG.toast("Google login failed", err.message);
        }
      }
      AG.init().then(async () => {
        const s = AG.session();
        if (s && (s.role === "admin" || s.role === "rider")) {
          await AG.logout({ stay: true });
        }
      });
    </script>
  </body>
</html>
