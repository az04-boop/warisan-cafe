<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Warisan Cafe" />
<link rel="apple-touch-icon" href="/images/logo.png?v=warisan" />
<meta name="theme-color" content="#1b7a3d" />

<title>Warisan Cafe</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="common.css">
<style>
  body { background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .landing-card { max-width: 410px; width: 100%; text-align: center; }
  .logo-circle { width: 168px; height: 168px; background: #000; border-radius: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 10px; box-shadow: var(--shadow-lg); margin-bottom: 24px; overflow: hidden; }
  .logo-circle img { width: 100%; height: 100%; object-fit: contain; }
  .brand-title { font-weight: 800; font-size: 2.3rem; letter-spacing: -.5px; margin-bottom: 6px; }
  .brand-title span.g { color: var(--green); }
  .brand-title span.r { color: var(--brand); }
  .brand-tagline { color: var(--muted); font-size: 1rem; margin-bottom: 32px; }
  .btn-landing { padding: 16px 22px; border-radius: 18px; font-weight: 700; font-size: 1.02rem; transition: var(--transition); border: 0; }
  .btn-landing.primary { background: var(--green); color: #fff; box-shadow: 0 8px 20px rgba(27, 122, 61, .35); }
  .btn-landing.primary:hover { background: var(--green-dark); transform: translateY(-2px); }
</style>
</head>
<body>
<div class="landing-card">
  <div class="logo-circle"><img src="images/logo.png?v=warisan" alt="Warisan Cafe"></div>
  <h1 class="brand-title"><span class="g">Warisan</span> <span class="r">Cafe</span></h1>
  <p class="brand-tagline">Service beyond your expectation</p>

  <div class="d-grid gap-3">
    <a href="login1.html" class="btn btn-landing primary"><i class="bi bi-person-fill me-2"></i>Start Ordering</a>
  </div>
</div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
