<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="GepukGO" />
<link rel="apple-touch-icon" href="/images/logo.png" />
<meta name="theme-color" content="#b94b4d" />

<title>Ayam Gepuk Pagoh — GepukGO</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="common.css">
<style>
  body { background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 60%, #6e2628 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; overflow: hidden; }
  body:before, body:after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.05); pointer-events: none; }
  body:before { width: 380px; height: 380px; top: -120px; right: -100px; }
  body:after { width: 280px; height: 280px; bottom: -100px; left: -80px; }
  .landing-card { max-width: 410px; width: 100%; text-align: center; position: relative; z-index: 2; }
  .logo-circle { width: 160px; height: 160px; background: #fff; border-radius: 36px; display: inline-flex; align-items: center; justify-content: center; padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.25); margin-bottom: 24px; }
  .logo-circle img { width: 100%; height: 100%; object-fit: contain; }
  .brand-title { color: #fff; font-weight: 800; font-size: 2.4rem; letter-spacing: -.5px; margin-bottom: 6px; }
  .brand-tagline { color: rgba(255,255,255,.85); font-size: 1rem; margin-bottom: 38px; }
  .btn-landing { padding: 16px 22px; border-radius: 18px; font-weight: 700; font-size: 1.02rem; transition: var(--transition); border: 0; }
  .btn-landing.primary { background: var(--green); color: #fff; box-shadow: 0 8px 20px rgba(46, 204, 113, .4); }
  .btn-landing.primary:hover { background: var(--green-dark); transform: translateY(-2px); box-shadow: 0 12px 26px rgba(46, 204, 113, .5); }
  .btn-landing.secondary { background: rgba(255,255,255,.95); color: var(--brand-dark); }
  .btn-landing.secondary:hover { background: #fff; transform: translateY(-2px); }
  .footer-note { color: rgba(255,255,255,.6); font-size: .8rem; margin-top: 28px; }
</style>
</head>
<body>
<div class="landing-card">
  <div class="logo-circle"><img src="images/logo.png" alt="Logo"></div>
  <h1 class="brand-title">GepukGO</h1>
  <p class="brand-tagline">We deliver delicious ayam gepuk straight to you</p>

  <div class="d-grid gap-3">
    <a href="login1.html" class="btn btn-landing primary"><i class="bi bi-person-fill me-2"></i>Start Ordering</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
