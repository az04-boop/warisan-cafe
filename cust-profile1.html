<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Warisan Cafe" />
    <link rel="apple-touch-icon" href="/images/logo.png?v=warisan" />
    <meta name="theme-color" content="#1b7a3d" />

    <title>Profile — Warisan Cafe</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="common.css" />
    <style>
      .profile-hero {
        background: var(--header-grad);
        color: #fff;
        padding: 28px 20px 70px;
        text-align: center;
        border-radius: 0 0 28px 28px;
      }
      .avatar-wrap {
        width: 92px;
        height: 92px;
        margin: 0 auto 10px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
      }
      .avatar-wrap i {
        font-size: 4rem;
        color: var(--green);
      }
      .profile-hero h5 {
        font-weight: 800;
        margin: 0 0 4px;
      }
      .profile-hero .email-chip {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 0.8rem;
        display: inline-block;
      }
      .profile-info {
        background: #fff;
        border-radius: 18px;
        padding: 18px;
        box-shadow: var(--shadow-sm);
        margin-top: -50px;
        position: relative;
        z-index: 5;
      }
      .info-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .info-row:last-of-type {
        border-bottom: 0;
      }
      .info-row .icn {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--brand-soft);
        color: var(--brand);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        flex-shrink: 0;
      }
      .info-row .info-text small {
        color: var(--muted);
        font-size: 0.75rem;
        display: block;
      }
      .info-row .info-text strong {
        font-size: 0.92rem;
      }
      .stat-mini {
        background: #fff;
        border-radius: 14px;
        padding: 14px;
        text-align: center;
        box-shadow: var(--shadow-sm);
      }
      .stat-mini .num {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--brand);
      }
      .stat-mini .lbl {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-weight: 600;
      }
      .section-card {
        background: #fff;
        border-radius: 18px;
        padding: 16px;
        box-shadow: var(--shadow-sm);
        margin-top: 14px;
      }
      .fav-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .fav-row:last-of-type {
        border-bottom: 0;
      }
      .fav-rank {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--brand-soft);
        color: var(--brand);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 0.85rem;
        margin-right: 10px;
      }
      .history-item {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        margin-bottom: 10px;
        transition: var(--transition);
      }
      .history-item:hover {
        border-color: var(--brand-soft);
        box-shadow: var(--shadow-sm);
      }
      .history-item:last-of-type {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div
      class="mobile-shell"
      style="padding-bottom: 90px; background: var(--bg)"
    >
      <div class="profile-hero">
        <div class="avatar-wrap"><i class="bi bi-person-fill"></i></div>
        <h5 id="name">Loading...</h5>
        <span class="email-chip" id="email">—</span>
      </div>

      <div class="page-pad" style="margin-top: -30px">
        <div class="profile-info">
          <div class="info-row">
            <span class="icn"><i class="bi bi-telephone-fill"></i></span>
            <div class="info-text">
              <small>Phone</small><strong id="phone">—</strong>
            </div>
          </div>
          <div class="info-row">
            <span class="icn"><i class="bi bi-geo-alt-fill"></i></span>
            <div class="info-text">
              <small>Delivery Address</small
              ><strong id="address">No address saved</strong>
            </div>
          </div>

          <div class="d-grid gap-2 mt-3">
            <button
              class="btn btn-outline-brand"
              data-bs-toggle="modal"
              data-bs-target="#editProfileModal"
            >
              <i class="bi bi-pencil-square me-1"></i> Edit Profile
            </button>
            <button onclick="AG.logout()" class="btn btn-brand">
              <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
          </div>
        </div>

        <div class="row g-2 mt-3">
          <div class="col-6">
            <div class="stat-mini">
              <div class="num" id="statTotalOrders">0</div>
              <div class="lbl">Orders</div>
            </div>
          </div>
          <div class="col-6">
            <div class="stat-mini">
              <div class="num" id="statDelivered">0</div>
              <div class="lbl">Delivered</div>
            </div>
          </div>
        </div>

        <div class="section-card">
          <h6 class="fw-bold mb-2">
            <i class="bi bi-clock-history text-brand me-2"></i>Order History
          </h6>
          <div id="historyBox"></div>
        </div>
      </div>

      <div class="bottom-nav">
        <a href="cust-menu1.html"><i class="bi bi-house-door"></i>Menu</a>
        <a href="cust-cart1.html"><i class="bi bi-cart"></i>Cart</a>
        <a href="cust-track1.html"><i class="bi bi-card-list"></i>Track</a>
        <a href="cust-profile1.html" class="active"
          ><i class="bi bi-person-fill"></i>Profile</a
        >
      </div>
    </div>

    <div class="modal fade" id="editProfileModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 24px; border: 0">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold">Edit Profile</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <label class="form-label fw-semibold">Name</label>
            <input
              type="text"
              id="editName"
              class="form-control mb-3"
              placeholder="Your name"
            />
            <label class="form-label fw-semibold">Phone <span class="text-danger">*</span></label>
            <input
              type="text"
              id="editPhone"
              class="form-control mb-3"
              placeholder="01X-XXXXXXX"
              required
            />
            <label class="form-label fw-semibold">Delivery address <span class="text-danger">*</span></label>
            <input
              type="text"
              id="editAddressDetail"
              class="form-control"
              placeholder="e.g. Blok A, Bilik 203 / No. 12, Jalan Mawar"
            />
          </div>
          <div class="modal-footer border-0">
            <button
              type="button"
              class="btn btn-light rounded-pill px-4"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-brand rounded-pill px-4"
              id="saveProfileBtn"
            >
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script>
      let currentProfile = null;
      let historyOrders = [];

      function renderProfile(p) {
        currentProfile = p;
        document.getElementById("name").textContent = p.name || "Customer";
        document.getElementById("email").textContent = p.email || "—";
        document.getElementById("phone").textContent = p.phone || "—";
        document.getElementById("address").textContent =
          p.address || "No address saved";
        document.getElementById("editName").value = p.name || "";
        document.getElementById("editPhone").value = p.phone || "";
        document.getElementById("editAddressDetail").value =
          p.addressDetail || p.address || "";
        renderProfileExtras();
      }

      function renderProfileExtras() {
        const orders = historyOrders.length
          ? historyOrders
          : AG.getCustomerOrders(currentProfile);
        document.getElementById("statTotalOrders").textContent = orders.length;
        document.getElementById("statDelivered").textContent = orders.filter(
          (o) => o.status === "delivered",
        ).length;

        const hist = document.getElementById("historyBox");
        hist.innerHTML = orders.length
          ? orders
              .map(
                (o) => `<div class="history-item">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <strong>${o.id}</strong>${AG.statusBadge(o.status)}
        </div>
        <div class="small-muted">${o.createdAt ? new Date(o.createdAt).toLocaleString() : ""}</div>
        <div class="small-muted">${AG.orderDetails(o)}</div>
        <div class="fw-bold text-brand mt-1">RM ${Number(o.total || 0).toFixed(2)}</div>
      </div>`,
              )
              .join("")
          : '<p class="text-muted small mb-0 text-center py-3">No order history yet.</p>';
      }

      (async () => {
        const s = await AG.requireRole(["customer"], []);
        if (!s) return;
        const profile = await AG.getCustomerProfile();
        renderProfile(profile);
        AG.fetchCustomerOrderHistory(12)
          .then((list) => {
            historyOrders = list || [];
            renderProfileExtras();
          })
          .catch(() => renderProfileExtras());
        if (
          new URLSearchParams(location.search).get("need") === "contact" ||
          AG.needsCustomerContact(profile)
        ) {
          AG.toast(
            "Details required",
            "Please add your phone number and delivery address.",
          );
          const openEdit = () => {
            const modalEl = document.getElementById("editProfileModal");
            if (window.bootstrap && modalEl) {
              bootstrap.Modal.getOrCreateInstance(modalEl).show();
              return true;
            }
            return false;
          };
          if (!openEdit()) {
            const wait = setInterval(() => {
              if (openEdit()) clearInterval(wait);
            }, 80);
            setTimeout(() => clearInterval(wait), 2500);
          }
        }
      })();

      document
        .getElementById("saveProfileBtn")
        .addEventListener("click", async () => {
          const phone = document.getElementById("editPhone").value.trim();
          const address = document
            .getElementById("editAddressDetail")
            .value.trim();
          if (!phone || !address) {
            AG.toast(
              "Details required",
              "Please add your phone number and delivery address.",
            );
            return;
          }
          try {
            const updated = await AG.updateCustomerProfile({
              name: document.getElementById("editName").value.trim(),
              phone,
              addressArea: "",
              addressDetail: address,
            });
            renderProfile(updated);
            bootstrap.Modal.getInstance(
              document.getElementById("editProfileModal"),
            ).hide();
            AG.toast(
              "Profile updated",
              "Your profile information has been saved.",
            );
          } catch (err) {
            AG.toast("Update failed", err.message);
          }
        });
    </script>
  </body>
</html>
