<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1b7a3d" />
    <title>Admin Rider — Warisan Cafe</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        background: #f5f6f8;
      }
      .admin-layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 240px;
        background: var(--header-grad);
        color: white;
        padding: 24px 18px;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        overflow-y: auto;
      }
      .sidebar-logo {
        width: 88px;
        height: 88px;
        object-fit: contain;
        background: #111;
        border-radius: 16px;
        padding: 6px;
        display: block;
        margin: 0 auto 14px;
      }
      .sidebar h5 {
        text-align: center;
        font-weight: 800;
        margin-bottom: 28px;
      }
      .nav-link-admin {
        display: flex;
        align-items: center;
        gap: 10px;
        color: white;
        text-decoration: none;
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 8px;
        font-weight: 600;
        cursor: pointer;
        border: 0;
        background: transparent;
        width: 100%;
        text-align: left;
      }
      .nav-link-admin:hover,
      .nav-link-admin.active {
        background: rgba(0, 0, 0, 0.28);
        color: #fff;
      }
      .sidebar-footer {
        margin-top: 22px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        padding-top: 12px;
      }
      .admin-main {
        margin-left: 240px;
        padding: 28px;
        width: calc(100% - 240px);
      }
      .dashboard-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }
      .card-soft {
        background: white;
        border: 0;
        border-radius: 20px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.06);
        padding: 22px 24px;
        overflow: hidden;
      }
      .form-control {
        border: none;
        background: #f1f1f1;
        border-radius: 12px;
        min-height: 46px;
        width: 100%;
      }
      .btn-brand {
        background: var(--header-grad);
        color: white;
        border-radius: 12px;
        border: none;
        font-weight: 700;
        min-height: 46px;
        padding: 0 22px;
      }
      .btn-brand:hover {
        background: #a73f42;
        color: white;
      }
      .rider-form {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        max-width: 420px;
      }
      .rider-form label {
        display: block;
      }
      .rider-form .btn-brand {
        width: 100%;
      }
      .table > :not(caption) > * > * {
        padding: 14px 12px;
      }
      @media (max-width: 768px) {
        .admin-layout {
          display: block;
        }
        .sidebar {
          position: relative;
          width: 100%;
          height: auto;
          bottom: auto;
        }
        .admin-main {
          margin-left: 0;
          width: 100%;
          padding: 18px;
        }
        .rider-form {
          grid-template-columns: 1fr;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar">
        <img src="images/logo.png?v=warisan" class="sidebar-logo" alt="Logo" />
        <h5>WARISAN CAFE</h5>
        <a class="nav-link-admin" href="admin-dashboard1.html"
          ><i class="bi bi-speedometer2"></i> Orders</a
        >
        <a class="nav-link-admin" href="admin-batch1.html"
          ><i class="bi bi-calendar-plus"></i> Batch</a
        >
        <a class="nav-link-admin" href="admin-menu1.html"
          ><i class="bi bi-list-ul"></i> Menu</a
        >
        <a class="nav-link-admin active" href="admin-riders1.html"
          ><i class="bi bi-bicycle"></i> Rider</a
        >
        <div class="sidebar-footer">
          <button class="nav-link-admin" type="button" onclick="AG.logout()">
            <i class="bi bi-box-arrow-left"></i> Logout
          </button>
        </div>
      </aside>
      <main class="admin-main">
        <div class="dashboard-top">
          <div>
            <h2>Rider</h2>
            <p>Add riders with a name and phone number. Customers call this number after the rider accepts the job.</p>
          </div>
        </div>
        <div class="card-soft mb-4">
          <h4 class="fw-bold mb-3">Add rider</h4>
          <div class="rider-form">
            <div>
              <label class="form-label fw-semibold" for="riderNameInput">Name</label>
              <input id="riderNameInput" class="form-control" placeholder="Rider name" />
            </div>
            <div>
              <label class="form-label fw-semibold" for="riderPhoneInput">Phone number</label>
              <input id="riderPhoneInput" type="tel" class="form-control" placeholder="01X-XXXXXXX" />
            </div>
            <button class="btn btn-brand" type="button" id="saveRiderBtn">Save</button>
          </div>
        </div>
        <div class="card-soft">
          <h4 class="fw-bold mb-3">Rider list</h4>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="riderBody">
                <tr>
                  <td colspan="3" class="text-muted text-center py-4">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }
      function renderRiders() {
        const list = AG.riders();
        const body = document.getElementById("riderBody");
        if (!list.length) {
          body.innerHTML =
            '<tr><td colspan="3" class="text-muted text-center py-4">No riders yet. Add a name and phone number.</td></tr>';
          return;
        }
        body.innerHTML = list
          .map(
            (r) =>
              `<tr><td><strong>${escapeHtml(r.name)}</strong></td><td>${escapeHtml(r.phone)}</td><td class="text-end"><button class="btn btn-sm btn-outline-danger" type="button" onclick="removeRider('${escapeHtml(r.id)}')">Delete</button></td></tr>`,
          )
          .join("");
      }
      window.removeRider = async function (id) {
        if (!confirm("Delete this rider?")) return;
        try {
          await AG.deleteRider(id);
          renderRiders();
        } catch (err) {
          AG.toast("Delete failed", err.message);
        }
      };
      (async () => {
        const s = await AG.requireRole(["admin"], ["riders"]);
        if (!s) return;
        renderRiders();
        window.addEventListener("ag-data", renderRiders);
        document.getElementById("saveRiderBtn").addEventListener("click", async () => {
          try {
            await AG.saveRider({
              name: document.getElementById("riderNameInput").value,
              phone: document.getElementById("riderPhoneInput").value,
            });
            document.getElementById("riderNameInput").value = "";
            document.getElementById("riderPhoneInput").value = "";
            renderRiders();
          } catch (err) {
            AG.toast("Rider details required", err.message);
          }
        });
      })();
    </script>
  </body>
</html>
