<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Warisan Cafe" />
    <link rel="apple-touch-icon" href="/images/logo.png?v=warisan" />
    <meta name="theme-color" content="#1b7a3d" />


    <title>Rider Dashboard — Warisan Cafe</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="common.css" />
    <style>
      .rider-stats {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-bottom: 18px;
      }
      .rider-stat {
        background: #fff;
        border-radius: 14px;
        padding: 12px;
        text-align: center;
        box-shadow: var(--shadow-sm);
      }
      .rider-stat .num {
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--brand);
      }
      .rider-stat .lbl {
        font-size: 0.68rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        font-weight: 600;
      }
      .job-card {
        background: #fff;
        border-radius: 18px;
        padding: 16px;
        box-shadow: var(--shadow-sm);
        margin-bottom: 12px;
        border-left: 4px solid var(--brand);
        transition: var(--transition);
      }
      .job-card:hover {
        box-shadow: var(--shadow);
        transform: translateY(-1px);
      }
      .job-card.ready {
        border-left-color: var(--green);
      }
      .job-card.picked_up {
        border-left-color: var(--info);
      }
      .job-card.out_for_delivery {
        border-left-color: var(--warning);
      }
      .job-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.88rem;
        margin-bottom: 6px;
      }
      .job-row i {
        width: 22px;
        color: var(--brand);
        flex-shrink: 0;
      }
      .filter-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .filter-tab {
        padding: 8px 16px;
        border-radius: 999px;
        background: #fff;
        color: var(--text);
        font-weight: 600;
        font-size: 0.82rem;
        cursor: pointer;
        white-space: nowrap;
        border: 1.5px solid var(--border);
        transition: var(--transition);
      }
      .filter-tab.active {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .section-title h6 {
        margin: 0;
        font-weight: 800;
        color: var(--muted);
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
    </style>
  </head>
  <body>
    <div class="mobile-shell" style="padding-bottom: 30px">
      <div id="header"></div>

      <div class="page-pad">
        <div class="summary-card mb-3 p-3" style="background:#fff;border-radius:16px;box-shadow:var(--shadow-sm)">
          <label class="form-label fw-bold mb-1">I am delivering as</label>
          <p class="small-muted mb-2">Admin adds riders under Rider. Pick your name before you accept a job. The customer can then call your number.</p>
          <select id="activeRiderSelect" class="form-select"></select>
        </div>

        <div class="rider-stats">
          <div class="rider-stat">
            <div class="num" id="statReady">0</div>
            <div class="lbl">Ready</div>
          </div>
          <div class="rider-stat">
            <div class="num" id="statActive">0</div>
            <div class="lbl">Active</div>
          </div>
          <div class="rider-stat">
            <div class="num" id="statDoneToday">0</div>
            <div class="lbl">Done Today</div>
          </div>
        </div>

        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All Jobs</button>
          <button class="filter-tab" data-filter="ready">Ready</button>
        </div>

        <div class="section-title">
          <h6>Available Jobs</h6>
          <span class="small-muted"><span id="jobCount">0</span> jobs</span>
        </div>

        <div id="jobs"></div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
      let activeFilter = "all";

      (async () => {
        const s = await AG.requireRole(["rider"], ["orders", "riders"]);
        if (!s) return;
        document.getElementById("header").innerHTML = AG.header(
          "Rider Dashboard",
          "rider",
        );
        function selectedRider() {
          const id = document.getElementById("activeRiderSelect").value;
          return AG.riders().find((r) => r.id === id) || AG.riders()[0] || null;
        }
        function renderRiderSelect() {
          const sel = document.getElementById("activeRiderSelect");
          const list = AG.riders();
          const current = AG.get("agActiveRiderId", "");
          sel.innerHTML = list.length
            ? list
                .map(
                  (r) =>
                    `<option value="${r.id}">${r.name} · ${r.phone}</option>`,
                )
                .join("")
            : '<option value="">No rider yet — ask admin to add one</option>';
          if (current && list.some((r) => r.id === current)) sel.value = current;
        }
        document.getElementById("activeRiderSelect").addEventListener("change", (e) => {
          AG.set("agActiveRiderId", e.target.value);
        });
        window.acceptJobAndOpen = async function (orderId, alreadyAccepted) {
          if (alreadyAccepted) {
            location.href = "rider-status1.html?order=" + orderId;
            return;
          }
          const rider = selectedRider();
          if (!rider) {
            AG.toast(
              "Rider required",
              "Ask admin to add a rider name and phone first.",
            );
            return;
          }
          try {
            await AG.acceptJob(orderId, rider);
            location.href = "rider-status1.html?order=" + orderId;
          } catch (err) {
            AG.toast("Accept failed", err.message);
          }
        };
        renderRiderSelect();
        window.addEventListener("ag-data", renderRiderSelect);

        document.querySelectorAll(".filter-tab").forEach((tab) =>
          tab.addEventListener("click", () => {
            document
              .querySelectorAll(".filter-tab")
              .forEach((t) => t.classList.remove("active"));
            tab.classList.add("active");
            activeFilter = tab.dataset.filter;
            renderJobs();
          }),
        );


        window.renderJobs = function () {
          const all = AG.orders();
          const active = all.filter((o) => AG.kitchenStatus(o.status) === "ready");
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          document.getElementById("statReady").textContent = active.length;
          document.getElementById("statActive").textContent = active.length;
          document.getElementById("statDoneToday").textContent = all.filter(
            (o) =>
              AG.kitchenStatus(o.status) === "delivered" &&
              new Date(o.updatedAt || o.createdAt) >= today,
          ).length;

          let list = active;
          if (activeFilter !== "all")
            list = list.filter((o) => o.status === activeFilter);
          document.getElementById("jobCount").textContent = list.length;

          const wrap = document.getElementById("jobs");
          if (!list.length) {
            wrap.innerHTML = `<div class="empty-state"><i class="bi bi-bicycle"></i><h6>No jobs available</h6><p>You're all caught up — new orders will appear here.</p></div>`;
            return;
          }
          wrap.innerHTML = list
            .map(
              (o) => `
      <div class="job-card ${o.status}">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <strong>Order ${o.id}</strong>
          ${AG.statusBadge(o.status)}
        </div>
        <div class="job-row"><i class="bi bi-shop"></i> Warisan Cafe</div>
        <div class="job-row"><i class="bi bi-geo-alt-fill"></i> <strong>${o.address}</strong></div>
        <div class="job-row"><i class="bi bi-bag-fill"></i> ${AG.orderDetails(o)}</div>
        <div class="d-flex justify-content-between align-items-center mt-2">
          <strong class="text-green" style="font-size:1.05rem;">RM ${Number(o.total).toFixed(2)}</strong>
          <div class="d-flex gap-2 align-items-center">
            <a href="${o.phone ? "tel:" + String(o.phone).replace(/[^\d+]/g, "") : "rider-chat1.html?order=" + o.id}" class="btn btn-sm btn-outline-secondary" style="border-radius:10px;padding:6px 10px;" title="Call customer">
              <i class="bi bi-telephone-fill"></i>
            </a>
            <button type="button" class="btn btn-sm ${o.status === "ready" && !o.riderPhone ? "btn-green" : "btn-brand"}" onclick="acceptJobAndOpen('${o.id}', ${o.riderPhone ? "true" : "false"})">
              ${o.status === "ready" && !o.riderPhone ? '<i class="bi bi-check-circle me-1"></i>ACCEPT JOB' : '<i class="bi bi-arrow-right-circle me-1"></i>UPDATE'}
            </button>
          </div>
        </div>
      </div>`,
            )
            .join("");
        };
        renderJobs();
        setInterval(renderJobs, 4000);
        window.addEventListener("ag-data", renderJobs);
      })();
    </script>
  </body>
</html>
