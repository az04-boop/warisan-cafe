<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Warisan Cafe" />
    <link rel="apple-touch-icon" href="/images/logo.png?v=warisan" />
    <meta name="theme-color" content="#1b7a3d" />

    <title>Create Account — Warisan Cafe</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="common.css" />
    <style>
      .reg-header {
        background: var(--header-grad);
        color: #fff;
        padding: 28px 22px 36px;
        border-radius: 0 0 28px 28px;
        text-align: center;
      }
      .reg-card {
        background: #fff;
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 22px;
        margin-top: -30px;
        position: relative;
        z-index: 5;
      }
      .reg-card label {
        font-weight: 600;
        font-size: 0.85rem;
        margin-top: 10px;
        margin-bottom: 4px;
        display: block;
        color: #444;
      }
    </style>
  </head>
  <body style="background: var(--bg)">
    <div class="mobile-shell" style="background: var(--bg)">
      <div class="reg-header">
        <img
          src="images/logo.png?v=warisan"
          style="
            width: 64px;
            height: 64px;
            background: #111;
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 8px;
          "
        />
        <h3 class="fw-bold m-0">Create Account</h3>
        <p class="m-0 mt-1 small" style="opacity: 0.85">
          Join Warisan Cafe and start ordering
        </p>
      </div>

      <div class="page-pad">
        <div class="reg-card">
          <form id="registerForm">
            <label>Full Name</label>
            <input
              id="name"
              class="form-control"
              placeholder="Ahmad Bin Abu"
              required
            />

            <label>Email</label>
            <input
              id="email"
              type="email"
              class="form-control"
              placeholder="example@gmail.com"
              required
            />

            <label>Phone Number <span class="text-danger">*</span></label>
            <input
              id="phone"
              type="tel"
              class="form-control"
              placeholder="01X-XXXXXXXX"
              required
            />

            <label>Delivery Address <span class="text-danger">*</span></label>
            <textarea
              id="address"
              class="form-control"
              rows="3"
              placeholder="Blok A1, Kolej Kediaman Pagoh"
              required
            ></textarea>

            <label>Create Password</label>
            <input
              id="password"
              type="password"
              class="form-control"
              required
              minlength="6"
            />

            <label>Confirm Password</label>
            <input
              id="confirmPassword"
              type="password"
              class="form-control"
              required
              minlength="6"
            />

            <button class="btn btn-brand w-100 py-3 mt-4" id="signupBtn">
              <i class="bi bi-person-plus me-1"></i> SIGN UP
            </button>
            <p class="small text-muted mt-3 mb-0" style="font-size:0.72rem;line-height:1.4">
              By signing up you agree we may store your name, phone and delivery address to fulfil orders.
            </p>
          </form>
          <div class="text-center mt-3">
            <a class="small text-muted text-decoration-none" href="login1.html"
              ><i class="bi bi-arrow-left me-1"></i>Already have account? Log
              in</a
            >
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const form = document.getElementById("registerForm");
        const btn = document.getElementById("signupBtn");
        try {
          await AG.init();
        } catch (err) {
          alert("System error: " + err.message);
          return;
        }
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const password = document.getElementById("password").value;
          const confirm = document.getElementById("confirmPassword").value;
          if (password !== confirm) {
            AG.toast(
              "Password not match",
              "Please confirm your password again.",
            );
            return;
          }
          const phone = document.getElementById("phone").value.trim();
          const address = document.getElementById("address").value.trim();
          if (!phone || !address) {
            AG.toast(
              "Details required",
              "Please add your phone number and delivery address.",
            );
            return;
          }
          try {
            btn.disabled = true;
            btn.innerHTML =
              '<span class="spinner-border spinner-border-sm me-2"></span>CREATING...';
            await AG.registerCustomer({
              name: document.getElementById("name").value.trim(),
              email: document.getElementById("email").value.trim(),
              phone: document.getElementById("phone").value.trim(),
              address: document.getElementById("address").value.trim(),
              password,
            });
            AG.toast("Account created", "You are logged in.");
            location.href = AG.needsCustomerContact()
              ? "cust-profile1.html?need=contact"
              : "cust-menu1.html";
          } catch (err) {
            AG.toast("Sign up failed", err.message);
          } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-person-plus me-1"></i> SIGN UP';
          }
        });
      });
    </script>
  </body>
</html>
