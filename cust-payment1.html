<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Warisan Cafe" />
    <link rel="apple-touch-icon" href="/images/logo.png?v=warisan" />
    <meta name="theme-color" content="#1b7a3d" />

    <title>QR Payment — Warisan Cafe</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="common.css" />
    <style>
      .sub-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        background: var(--header-grad);
        color: #fff;
        border-bottom: 0;
      }
      .sub-header .back {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(255,255,255,.2);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .sub-header h5 {
        margin: 0;
        font-weight: 800;
        color: #fff;
      }
      .qr-slot {
        width: min(100%, 280px);
        margin: 0 auto 16px;
        border: 1px solid #f4c6d4;
        border-radius: 18px;
        background: #fff;
        padding: 8px;
        overflow: hidden;
      }
      .qr-slot img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
      }
      .file-name {
        font-size: 0.85rem;
        color: #6b7280;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="mobile-shell" style="padding-bottom: 30px">
      <div class="sub-header">
        <a href="cust-cart1.html" class="back"
          ><i class="bi bi-chevron-left"></i
        ></a>
        <h5>QR Payment</h5>
      </div>

      <div class="page-pad">
        <div class="card-soft p-4 text-center" id="payPanel">
          <div class="qr-slot">
            <img
              id="paymentQrImage"
              src="images/qr-payment.jpg"
              alt="DuitNow QR — BXG Cafe"
            />
          </div>
          <p class="mb-1 fw-semibold">Scan the DuitNow QR to pay (BXG Cafe).</p>
          <p class="text-muted small mb-3">
            After completing payment, upload your payment receipt below.
          </p>
          <div class="fw-bold mb-3" id="payTotal">Total: RM 0.00</div>

          <label class="form-label fw-semibold text-start d-block"
            >Payment receipt</label
          >
          <input
            class="form-control"
            type="file"
            id="receiptFile"
            accept=".jpg,.jpeg,.png,image/jpeg,image/png"
          />
          <div class="small text-muted mt-2 text-start">
            Accepted: JPG or PNG screenshot · Maximum 5 MB · Avoid large PDFs
          </div>
          <div class="file-name text-start mt-2" id="selectedName">
            No file selected
          </div>
          <div class="alert alert-danger mt-3 mb-0 d-none text-start" id="errorBox"></div>
          <div class="alert alert-success mt-3 mb-0 d-none text-start" id="successBox"></div>
          <button class="btn btn-brand w-100 mt-3 py-2" id="submitBtn" type="button">
            <i class="bi bi-upload me-1"></i> Submit receipt
          </button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
      (async () => {
        const s = await AG.requireRole(["customer"], []);
        if (!s) return;

        const checkout = AG.get("agPendingCheckout", null);
        if (!checkout || !checkout.cart || !checkout.cart.length) {
          AG.toast("Checkout missing", "Return to cart and try again.");
          location.href = "cust-cart1.html";
          return;
        }

        document.getElementById("payTotal").textContent =
          "Total: RM " + Number(checkout.total || 0).toFixed(2);

        const fileInput = document.getElementById("receiptFile");
        const selectedName = document.getElementById("selectedName");
        const errorBox = document.getElementById("errorBox");
        const successBox = document.getElementById("successBox");
        const submitBtn = document.getElementById("submitBtn");

        function showError(msg) {
          errorBox.textContent = msg;
          errorBox.classList.remove("d-none");
          successBox.classList.add("d-none");
        }
        function showSuccess(msg) {
          successBox.textContent = msg;
          successBox.classList.remove("d-none");
          errorBox.classList.add("d-none");
        }

        fileInput.addEventListener("change", async () => {
          const file = fileInput.files[0];
          selectedName.textContent = file ? file.name : "No file selected";
          if (!file) return;
          try {
            await AG.validateReceiptFile(file);
            errorBox.classList.add("d-none");
          } catch (err) {
            fileInput.value = "";
            selectedName.textContent = "No file selected";
            showError(err.message || "Invalid receipt file.");
          }
        });

        submitBtn.addEventListener("click", async () => {
          const file = fileInput.files[0];
          try {
            submitBtn.disabled = true;
            submitBtn.innerHTML =
              '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';
            await AG.submitQrPayment(file);
            showSuccess(
              "Payment submitted. Waiting for admin verification.",
            );
            submitBtn.innerHTML =
              '<i class="bi bi-check-circle-fill me-1"></i> Submitted';
            setTimeout(() => (location.href = "cust-track1.html"), 1200);
          } catch (err) {
            showError(err.message || "Could not submit receipt.");
            submitBtn.disabled = false;
            submitBtn.innerHTML =
              '<i class="bi bi-upload me-1"></i> Submit receipt';
          }
        });
      })();
    </script>
  </body>
</html>
